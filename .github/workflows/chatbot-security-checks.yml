name: Chatbot security checks
on:
  push:
    branches: ['codex/kgmu-security-hardening']
    paths: ['script6.js', 'security/**', '.github/workflows/chatbot-security-checks.yml']
  pull_request:
    paths: ['script6.js', 'security/**', '.github/workflows/chatbot-security-checks.yml']
permissions:
  contents: read
jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Syntax and Worker regression tests
        run: |
          node --check ../script6.js
          node --check worker.mjs
          node test-worker.mjs
      - name: Install test dependencies
        run: npm install --no-save playwright@1.62.1 @firebase/rules-unit-testing firebase firebase-tools
      - name: Browser rendering and protected-source checks
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Firestore rules checks against disposable emulator
        run: npm run test:rules
