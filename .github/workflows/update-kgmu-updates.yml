name: Update KGMU live notices

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions cron is UTC.
    # 00:30 UTC = 06:00 Asia/Kolkata.
    - cron: "30 0 * * *"

    # 12:30 UTC = 18:00 Asia/Kolkata.
    - cron: "30 12 * * *"

permissions:
  contents: write

concurrency:
  group: update-kgmu-live-notices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-updates.txt

      - name: Install PDF and OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-hin

      - name: Install Python dependencies
        run: pip install -r requirements-updates.txt reportlab Pillow

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Fetch and inject live data
        run: python scripts/update_kgmu_updates.py

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No update."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add system_prompt1.txt latest_updates.json archive-live-data
          git commit -m "Update latest KGMU notices (v4 live-data)"
          git push
